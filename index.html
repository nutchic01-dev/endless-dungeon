<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ผู้กล้าแห่งดันเจี้ยนไร้สิ้นสุด</title>
<style>
:root{
  --bg:#1b1630; --panel:#2a2347; --panel2:#352c5a; --ink:#fff8ee; --muted:#c9bfe6;
  --gold:#ffd166; --hp:#ef476f; --hp2:#ff8fab; --exp:#06d6a0; --rune:#9b8cff;
  --btn:#ffb703; --btn-ink:#3b2300; --line:rgba(255,255,255,.12); --sp:#ff4d6d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;}
#app{min-height:100svh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0}

/* top bar */
.topbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#120e22;font-size:14px;flex-wrap:wrap;position:sticky;top:0;z-index:12;min-height:46px}
.chip{background:var(--panel);border-radius:999px;padding:3px 10px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.chip b{font-weight:700}
.rune-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.5)}
.tbr{margin-left:auto;display:flex;gap:6px;align-items:center}.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;min-width:34px;padding:0 9px;border-radius:10px;border:1px solid #5a4680;background:#231833;color:#f2e8ff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.tbtn img.uiico{height:22px}.tbtn.quit{background:linear-gradient(#ff8a5a,#c8392a);border-color:#ffd0a0;color:#fff}.tbtn:disabled{opacity:.45}
.proto{margin-left:auto;font-size:11px;color:var(--muted)}

/* scene */
.scene{position:relative;flex:none;height:40svh;min-height:230px;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px;transition:background .6s}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:28%;background:rgba(0,0,0,.25);border-top:2px solid rgba(255,255,255,.08)}
.party{position:relative;z-index:2;display:flex;align-items:flex-end;margin-bottom:9%}
.actor{position:relative;z-index:2;text-align:center}
.actor .em{font-size:84px;line-height:1;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));animation:bob 1.6s ease-in-out infinite}
.actor .em img.art{height:1.4em;width:auto;display:block;margin:0 auto;pointer-events:none}
.actor.mon .em img.art{height:1.15em}
img.art.flip{transform:scaleX(-1)}
img.art{height:1.3em;width:auto;vertical-align:middle;object-fit:contain;-webkit-user-drag:none}
.actor.mon .em img.art.boss{height:1.9em}
.fig .fe img.art{height:1.6em;display:block}
.fig .fe:has(img.art) .crown{display:none}
.avatar img.art{height:46px}
.reveal .ri img.art{height:64px}.reveal.small .ri img.art{height:44px}
.class-grid .ci img.art{height:52px}
.ccard img.art{height:44px}

.scene.hasart .ground{background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.28));border-top:0}
.sh-av img.art{height:70px;width:auto}
.ki img.art,.ci img.art{height:30px;width:auto}
.actor.me{margin-left:4px}
.actor.me .em{font-size:80px}
.actor.me::before{content:"";position:absolute;left:50%;bottom:34px;width:110px;height:26px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,214,102,.75),rgba(255,214,102,0));z-index:-1;animation:aura 2s ease-in-out infinite}
.actor.sp.me::before{background:radial-gradient(closest-side,rgba(255,77,109,.85),rgba(255,77,109,0))}
.actor.mate{margin-bottom:26px;opacity:.97}
.actor.mate .em{font-size:46px;animation-delay:.4s}
.actor.mate .nm{font-size:10px;max-width:74px;padding:0 5px}
.actor.mate .bar{width:56px;height:5px}
.actor.ko{filter:grayscale(1);opacity:.45}
.actor .nm{font-size:12px;background:rgba(0,0,0,.5);border-radius:8px;padding:1px 8px;margin-top:3px;display:inline-block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actor .nm.spn{color:#ffd1dc;box-shadow:0 0 0 1px var(--sp) inset}
.mon{margin-bottom:9%}
.bar{height:7px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;width:100px;margin:3px auto 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hp),var(--hp2));transition:width .25s}
.bar.g i{background:linear-gradient(90deg,#2ec4b6,#7bf1a8)}
.hit{animation:hit .25s}
.float{position:absolute;z-index:5;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:floatUp .9s forwards;pointer-events:none}
.float.crit{color:var(--gold);font-size:28px}
.float.heal{color:var(--exp)}
.floor-badge{position:absolute;top:10px;left:12px;z-index:3;background:rgba(0,0,0,.4);border-radius:10px;padding:4px 10px;font-size:13px}
.banner{position:absolute;left:0;right:0;top:34%;z-index:6;text-align:center;pointer-events:none;animation:banner 1.3s forwards}
.banner span{display:inline-block;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(20,10,40,.9) 15%,rgba(20,10,40,.9) 85%,rgba(0,0,0,0));
  padding:8px 40px;font-weight:800;font-size:17px;color:var(--gold);text-shadow:0 2px 0 #000}
.banner.sp span{color:#ffd1dc;text-shadow:0 0 10px var(--sp),0 2px 0 #000}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes aura{0%,100%{opacity:.6;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.15)}}
@keyframes hit{0%{transform:translateX(0)}30%{transform:translateX(-8px)}60%{transform:translateX(8px)}100%{transform:translateX(0)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.7)}15%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-50px)}}
@keyframes banner{0%{opacity:0;transform:scaleX(.3)}15%{opacity:1;transform:scaleX(1)}80%{opacity:1}100%{opacity:0}}

/* event panel */
.event{flex:none;min-height:calc(60svh - 46px);background:var(--panel);padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;border-top:3px solid #0d0a1a}
.ev-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.ev-text{font-size:15px;line-height:1.55;color:#f1eaff;white-space:pre-line}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.choice{background:var(--btn);color:var(--btn-ink);border-radius:14px;padding:11px 14px;min-height:50px;text-align:left;font-weight:700;font-size:15px;box-shadow:0 3px 0 #b07800;display:flex;justify-content:space-between;align-items:center;gap:10px}
.choice small{font-weight:500;font-size:12px;opacity:.85;text-align:right}
.choice.alt{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 #1d173a}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.log-lines{font-size:13px;color:var(--muted);line-height:1.5;overflow-y:auto;background:rgba(0,0,0,.2);border-radius:10px;padding:6px 10px}
.log-lines div.crit{color:var(--gold)}
.log-lines div.bad{color:var(--hp2)}
.log-lines div.good{color:var(--exp)}
.log-lines div.ult{color:#ffd1dc;font-weight:700}
.choices.grid{display:grid;grid-template-columns:1fr 1fr}
.choices.grid .choice{min-height:46px;padding:8px 10px;font-size:13px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.choices.grid .choice small{text-align:left}
.choices.grid .choice.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.r0{color:#ffffff}.r1{color:#7bf1a8}.r2{color:#c77dff}.r3{color:#ffa94d}.rs{color:#ff4d6d}
.choice:not(.alt) .r0{color:#3b2300}.choice:not(.alt) .r1{color:#0b5a2a}.choice:not(.alt) .r2{color:#5a189a}.choice:not(.alt) .r3{color:#9a3c00}
.gear-row{padding:3px 0;border-bottom:1px dashed var(--line)}
.gear-row .gs,.gs{color:var(--muted)}
.tabs button{font-size:12px}
.battle-tools{flex-direction:row}
.battle-tools .choice{flex:1;justify-content:center}
.event .log-lines{flex:1 1 auto;min-height:90px;max-height:28svh}
.scroll-hint{text-align:center;font-size:11px;color:var(--muted);opacity:.7;margin-top:2px}
.bar.r i{background:linear-gradient(90deg,var(--hp),var(--hp2))}

/* hero panel */
.hero{flex:0 0 auto;background:#221c3d;border-top:3px solid #0d0a1a;padding:8px 12px 10px}
.hero.min .tabs,.hero.min .tabpane{display:none}
.fold{background:var(--panel);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap}
.hero-head{display:flex;align-items:center;gap:10px}
.hero-head .av{font-size:24px;width:36px;height:36px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.hero-head .meta{flex:1;min-width:0}
.hero-head .meta .l1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigbar{height:12px;background:rgba(0,0,0,.4);border-radius:8px;overflow:hidden;position:relative;margin-top:4px}
.bigbar i{display:block;height:100%;transition:width .3s}
.bigbar span{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;color:#fff;text-shadow:0 1px 0 #000}
.tabs{display:flex;gap:6px;margin:8px 0 6px}
.tabs button{flex:1;background:var(--panel);color:var(--muted);border-radius:10px;padding:5px 0;font-size:13px}
.tabs button.on{background:var(--panel2);color:var(--ink);font-weight:700}
.tabpane{font-size:12px;max-height:74px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.stats div span:first-child{color:var(--muted)}
.tag{display:inline-block;background:var(--panel);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
.tag.bad{background:#4a1d33;color:var(--hp2)}
.tag.sp{background:#4a1d33;color:#ffd1dc}
.mate-row{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.mate-row .mi{font-size:20px;width:26px;text-align:center}
.mate-row .mm{flex:1;min-width:0}
.mate-row .bigbar{height:8px;margin-top:2px}



/* skills v2 + effects */
.chip.book{background:#2b3f7a;cursor:pointer}
.bookbar{display:flex;justify-content:space-between;align-items:center;background:rgba(77,124,255,.15);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:13px}
.bookbar b{color:#9fc3ff}
.skh{display:flex;justify-content:space-between;gap:6px}.sklv{font-size:11px;color:#9fc3ff;white-space:nowrap}.sklv.max{color:var(--gold)}
.skcard .sn{font-size:12px;color:#ffe9c2}.skcard.lock{opacity:.55}
.skcard .mini{align-self:center;min-width:56px}
.skpips{display:flex;gap:3px;margin-top:4px}.skpips i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}.skpips i.on{background:#7fb2ff}
.mst{font-size:15px;min-height:18px;letter-spacing:1px;margin-top:2px;text-shadow:0 1px 2px #000}
.banner.combo span{color:#fff3b0;background:linear-gradient(90deg,rgba(255,120,0,0),rgba(255,120,0,.85),rgba(255,120,0,0));text-shadow:0 0 10px #ff9f1c,0 2px 0 #000;font-size:20px}
.actor.lunge .em{animation:lunge .32s ease-out}
@keyframes lunge{0%{transform:translateX(0)}45%{transform:translateX(26px) scale(1.06)}100%{transform:translateX(0)}}
.scene.shake{animation:shk .25s}.scene.shake2{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.fx{position:absolute;z-index:7;pointer-events:none;width:0;height:0}
.fx i{position:absolute;left:0;top:0;font-style:normal;font-size:20px;transform:translate(-50%,-50%);animation:burst .6s ease-out forwards}
.fx.big i{font-size:28px}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-1*var(--d))) scale(1.2)}}
.fx-slash::before,.fx-claw::before{content:"";position:absolute;left:-40px;top:-6px;width:80px;height:12px;border-radius:50%;background:linear-gradient(90deg,transparent,#fff,transparent);transform:rotate(-35deg);animation:slash .35s ease-out forwards;box-shadow:0 0 12px #fff}
.fx-claw::before{background:linear-gradient(90deg,transparent,#ff4d6d,transparent);box-shadow:0 0 12px #ff4d6d;transform:rotate(35deg)}
.fx-claw.big::before{width:130px;left:-65px;height:18px}
@keyframes slash{0%{opacity:0;clip-path:inset(0 100% 0 0)}40%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}
.fx-magic::after,.fx-ice::after,.fx-fire::after,.fx-thunder::after,.fx-poison::after{content:"";position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;animation:ring .5s ease-out forwards}
.fx-magic::after{border:3px solid #c77dff;box-shadow:0 0 14px #c77dff}.fx-ice::after{border:3px solid #9be7ff;box-shadow:0 0 14px #9be7ff}
.fx-fire::after{background:radial-gradient(circle,rgba(255,180,60,.9),rgba(255,80,0,0) 70%)}.fx-thunder::after{background:radial-gradient(circle,rgba(255,255,160,.95),rgba(255,230,0,0) 70%)}
.fx-poison::after{background:radial-gradient(circle,rgba(120,255,120,.7),rgba(0,160,60,0) 70%)}
@keyframes ring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.fx-dot::after{content:"";position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,rgba(180,255,120,.6),transparent 70%);animation:ring .45s forwards}
.fx-heal i{color:#7bf1a8;font-weight:900;animation-duration:.7s}.fx-buff i{color:#ffd166;font-size:16px}
.fx-shield::after{content:"";position:absolute;left:-34px;top:-40px;width:68px;height:80px;border-radius:50%;border:2px solid rgba(120,200,255,.9);background:radial-gradient(circle,rgba(120,200,255,.0) 55%,rgba(120,200,255,.35));animation:ring .6s ease-out reverse forwards}
.proj{position:absolute;z-index:7;font-size:22px;transform:translate(0,0);transition:transform .28s linear,opacity .28s;pointer-events:none;margin:-12px 0 0 -12px;filter:drop-shadow(0 0 6px #fff)}
.proj.p-arrow{font-size:26px;color:#fff}
/* hub */
.overlay.hub{gap:10px}
.wallet{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wallet span{background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.wallet b{color:var(--gold)}
.wallet.home{flex-wrap:nowrap;gap:5px;max-width:100%}.wallet.home>span{padding-left:9px!important;padding-right:10px!important;white-space:nowrap;min-width:0}
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px}
.hubgrid button{background:var(--panel);color:var(--ink);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--panel2)}
.hubgrid .hi{font-size:30px}.hubgrid small{color:var(--muted);font-size:12px}
.hubhead{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;font-size:18px;margin-top:0!important}.hubhead .back{white-space:nowrap;flex:none}.hubhead>b{min-width:0;font-size:clamp(14px,4.6vw,18px);line-height:1.25}
.overlay.hub>.hubhead:first-child{margin-top:0}
.back{background:var(--panel2);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:13px}
.hubmsg{background:#1f4d3a;color:#c7ffe6;border-radius:10px;padding:6px 12px;font-size:13px;max-width:420px}
.overlay.hub .sumbox{width:100%;max-width:420px;text-align:left}
.row2{display:flex;gap:8px;width:100%;max-width:420px}.row2 .choice{flex:1;flex-direction:column;gap:2px;max-width:none}
.pulls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.pull{border-radius:8px;padding:3px 8px;font-size:12px;background:var(--panel)}
.t0{color:#fff}.t1{color:#7ee2a8}.t2{color:#d0a2ff}.t3{color:#ffb35c}
.tt{border-radius:6px;padding:1px 6px;background:var(--panel2);font-size:12px}
.pbar{margin:6px 0}.pl{display:flex;justify-content:space-between;font-size:13px}
.pbr{height:6px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden;margin-top:3px}.pbr i{display:block;height:100%;background:linear-gradient(90deg,var(--rune),var(--gold))}
.srow{display:flex;align-items:center;gap:8px;margin:6px 0}
.sl2{width:58px;font-size:12px;color:var(--muted);flex-shrink:0}
.sitem{flex:1;background:rgba(0,0,0,.2);border-radius:10px;padding:6px 8px;font-size:13px;min-width:0;border-left:3px solid var(--panel2)}
.sitem .gs{font-size:11px}.sitem.empty{color:var(--muted);font-size:12px}
.sitem.g1{border-left-color:#4ade80}.sitem.g2{border-left-color:#c084fc}.sitem.g3{border-left-color:#fb923c}
.mini{background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:7px 8px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;min-width:74px}
.mini:disabled{opacity:.4}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;text-align:left}
.cmp h3{font-size:14px;margin:0 0 4px}.cmp .choice{margin-top:8px;width:100%}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:420px}
.ccard{background:var(--panel2);color:var(--ink);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.ccard.sp{border-color:var(--sp)}.ccard.hid{border-color:var(--gold)}
.ccard.lock .cci{filter:grayscale(1) brightness(.6)}
.cci{font-size:30px}.ccn{font-size:11px;font-weight:700;line-height:1.25;text-align:center}
.ccs{font-size:11px;color:var(--muted)}.ccard .gs{font-size:11px}.ccs.up{color:var(--exp);font-weight:700}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}.stars i{color:rgba(255,255,255,.18);font-style:normal}
.cpop{max-width:380px;max-height:88svh;overflow-y:auto}.cpop .pop-sub{text-align:left;letter-spacing:0;line-height:1.55}.cpop .pop-r{font-size:12px;gap:10px}.cpop .pop-r b{text-align:right;font-weight:600}.cpop .pop-h{display:flex;gap:10px;align-items:center}
.pop-r.on b{color:var(--exp)}
.pbtns{display:flex;flex-direction:column;gap:6px;margin-top:8px}.pbtns .choice{min-height:44px}
.class-grid button.spb{border-color:var(--sp)}

.overlay.hub{background:#140f28}.overlay.hub.home{justify-content:flex-start}
.overlay.hub>:first-child{margin-top:0}.overlay.hub>:last-child{margin-bottom:0}
.hubnav{position:sticky;bottom:-20px;margin:auto -20px -20px!important;width:calc(100% + 40px);display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(20,15,40,.97);border-top:1px solid var(--line);z-index:5}
.hubnav button{background:var(--panel);color:var(--muted);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px}
.hubnav span{font-size:22px}.hubnav small{font-size:11px;line-height:1.2}
.hubnav button.on{background:var(--panel2);color:var(--ink);box-shadow:0 0 0 2px var(--rune) inset}
.hubnav button.go{background:var(--btn);color:var(--btn-ink);font-weight:700}
.ptop{display:flex;align-items:center;gap:10px;width:100%;max-width:440px;text-align:left}
.avatar{width:54px;height:54px;border-radius:14px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid var(--gold);flex-shrink:0}
.avatar.form{box-shadow:0 0 14px var(--gold)}

/* event animations */
.spark{position:absolute;z-index:6;font-style:normal;font-size:14px;pointer-events:none;color:#ffd166;text-shadow:0 0 6px #ff9e3d;transform:translate(-50%,-50%);animation:spark .8s ease-out forwards}
.spark.fire{color:#ffcf6b}.spark.gold{font-size:18px}.spark.shard{color:#cfd8ff;text-shadow:0 0 6px #8fa7ff;font-size:16px}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 30px)) rotate(var(--r)) scale(.6)}}
.anvil{position:absolute;left:70%;bottom:26%;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.anvil .aitem{font-size:40px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,140,60,.8));transition:filter .2s}
.anvil .ablock{width:64px;height:16px;border-radius:4px 4px 8px 8px;background:linear-gradient(#5a5f6e,#2d3039);box-shadow:0 3px 0 #1a1c22,0 6px 10px rgba(0,0,0,.5);margin-top:-2px}
.anvil.ding .aitem{animation:ding .25s ease-out}
@keyframes ding{0%{transform:scale(1.25);filter:drop-shadow(0 0 16px #ffb347) brightness(1.6)}100%{transform:scale(1)}}
.anvil.win .aitem{animation:winglow 1.2s ease-out forwards}
@keyframes winglow{0%{transform:scale(1);filter:drop-shadow(0 0 4px #fff)}40%{transform:scale(1.5) translateY(-14px);filter:drop-shadow(0 0 22px #ffd166) brightness(1.5)}100%{transform:scale(1.3) translateY(-10px);filter:drop-shadow(0 0 12px #ffd166)}}
.anvil.broke .aitem{animation:broke .5s ease-in forwards}
@keyframes broke{0%{transform:scale(1.2) rotate(0)}60%{transform:scale(1.35) rotate(8deg);filter:brightness(2)}100%{transform:scale(.2) rotate(-20deg);opacity:0}}
.anvil.fail .aitem{animation:fail .5s ease-in-out}
@keyframes fail{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.actor.npc.smash .em{animation:smash .32s ease-in-out}
@keyframes smash{0%{transform:rotate(0)}35%{transform:rotate(14deg) translateY(-6px)}70%{transform:rotate(-16deg) translateX(-10px)}100%{transform:rotate(0)}}
.actor.prop.wobble .em{animation:wobble .45s ease-out}
@keyframes wobble{0%{transform:rotate(0)}25%{transform:rotate(12deg) translateX(6px)}55%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.actor.npc .em,.actor.prop .em{animation:none}
.actor.npc .em img.art{height:1.6em}

    'เคล็ดลับ: ล่ามังกรทุกวันเพื่อสะสมเกล็ดมังกรและตั๋วเรลิก','เคล็ดลับ: เศษวีรชนส่วนเกินย่อยเป็นผงดาวได้ที่หน้ากระเป๋า','เคล็ดลับ: เข้าสู่ระบบแล้วเล่นต่อได้ทุกเครื่อง เซฟขึ้นบัญชีให้อัตโนมัติ'];
  const STEP=['กำลังเปิดประตูดันเจี้ยน…','กำลังปลุกเหล่าวีรชน…','กำลังจุดคบเพลิงในหอคอย…','กำลังนับสมบัติในคลัง…','เกือบพร้อมแล้ว…'];
  let ti=Math.floor(Math.random()*TIPS.length); const showTip=()=>{ tip.style.opacity=0; setTimeout(()=>{ tip.textContent=TIPS[ti++%TIPS.length]; tip.style.opacity=1; },300); }; showTip(); const tipT=setInterval(showTip,3800);
  const files=["mode_boss.webp", "mode_daily.webp", "mode_element.webp", "mode_endless.webp", "mode_hundred.webp", "mode_nest.webp", "mode_pvp.webp", "ui_adv.webp", "ui_altar.webp", "ui_boss.webp", "ui_chars.webp", "ui_chest.webp", "ui_crystal.webp", "ui_dust.webp", "ui_equip.webp", "ui_gacha.webp", "ui_gold.webp", "ui_home.webp", "ui_lore.webp", "ui_medal.webp", "ui_mission.webp", "ui_oracle.webp", "ui_relicbox.webp", "ui_relictix.webp", "ui_scale.webp", "ui_settings.webp", "ui_shop.webp", "ui_skin.webp", "ui_ticket.webp", "ui_troop.webp", "bg_summon.jpg", "bg_sky.jpg", "char_villager.webp"]; let done=0, total=files.length+1, shown=0, pageLoaded=false, t0=Date.now();
  const set=p=>{ p=Math.max(shown,Math.min(1,p)); shown=p; fill.style.width=(p*100)+'%'; run.style.left=(p*100)+'%'; txt.textContent=STEP[Math.min(STEP.length-1,Math.floor(p*STEP.length))]; };
  const tick=()=>{ done++; set(done/total*0.95); check(); };
  files.forEach(f=>{ const im=new Image(); im.onload=im.onerror=tick; im.src='art/'+f; });
  window.addEventListener('load',()=>{ pageLoaded=true; tick(); });
  function check(){ if (done<total||!pageLoaded) return; const wait=Math.max(0,1600-(Date.now()-t0)); setTimeout(ready,wait); }
  let isReady=false;
  function ready(){ if (isReady) return; isReady=true; set(1); root.classList.add('ready'); }
  setTimeout(()=>{ pageLoaded=true; done=total; check(); },12000);   // เน็ตช้ามาก: ไม่ให้ค้างเกิน 12 วินาที
  root.addEventListener('click',()=>{ if (!isReady) return; clearInterval(tipT); root.classList.add('out'); setTimeout(()=>root.remove(),650); });
})();
</script>

  knight:{name:'อัศวินบาดเจ็บ', steps:[

      const m=makeMon(F); m.name='วิญญาณอัศวินแค้น'; m.icon='👻'; m.hp*=2.6; m.maxhp=m.hp; m.atk*=1.3;

        {label:'คืนดาบให้', sub:'เสียอาวุธที่ใส่อยู่', alt:true, fn:()=>{ S.gear.weapon=null; qEnd('วิญญาณรับดาบคืนแล้วจางหายไปอย่างสงบ'); }}]}; }]},
  shrine:{name:'ศาลเจ้าสามดวงไฟ', steps:[

      if (n<3) return qNext(`จุดไฟ${c}แล้ว เปลวไฟสั่นไหว...`);
      if (q.ok){ const o=pick(trainOptions(S.floor,4)); applyTrain(o); gainBook(1); qEnd(`ไฟทั้งสามสว่างพร้อมกัน! ได้ ${o.label} และตำราสกิล`); }
      else { S.goldCurse=Math.max(S.goldCurse,10); qEnd('ไฟดับวูบ... ลำดับผิด โดนคำสาปทองลด 10 ชั้น','bad'); } }}))}))]},
};
// เส้นทางแห่งโชคชะตา: เส้นเรื่องของตัวพิเศษ/ตัวลับ (ชนะบอสรอบนั้นแล้วได้ตัวถาวร)
function destinyPick(){ const m=loadMeta(), ids=Object.keys(ALLCHARS).filter(id=>ALLCHARS[id].tier!=='n' && (!S.char || id!==S.char.id) && CHAR_LORE[id]);
  const un=ids.filter(id=>!(m.chars&&m.chars[id])); const pool=un.length?un:ids; return pool[Math.floor(rng()*pool.length)]; }
function destinyStep(q){ const id=q.hero, a=ALLCHARS[id], L=CHAR_LORE[id], nm=a.c.name, F=S.floor, T=`📜 เส้นทางแห่งโชคชะตา (${q.step+1}/5)`;
  const others = k => shuffle(Object.keys(CHAR_LORE).filter(x=>x!==id && x!=='villager')).slice(0,k);
  switch(q.step){
    case 0: return {title:T, icon:'✨', text:`เศษความทรงจำชิ้นหนึ่งลอยเรืองแสง${a.tier==='hid'?'สีม่วงเข้ม':'สีทอง'}อยู่กลางห้อง ข้างในมีเงาของวีรชนคนหนึ่งกำลังมองมาที่คุณ`, choices:[
      {label:'เอื้อมมือแตะเศษความทรงจำ', fn:()=>{ q.ok=true; qNext('ความทรงจำไหลเข้ามาในหัว... เสียงหนึ่งกระซิบว่า "ตามหาข้า"'); }},
      {label:'เดินผ่านไป', alt:true, fn:()=>{ S.q=null; S.qCool=S.floor+20; done('เศษความทรงจำค่อยๆ จางหายไป'); }}]};
    case 1: { const opts=shuffle([L.trait, ...others(2).map(x=>CHAR_LORE[x].trait)]);
      return {title:T, icon:'💭', text:`ภาพความทรงจำปรากฏ: "${L.story.split(' ').slice(0,2).join(' ')}..."\nวีรชนผู้นี้มีนิสัยแบบไหน?`, choices: opts.map(t=>({label:t, fn:()=>{ if (t!==L.trait){ S.q=null; S.qCool=S.floor+20; return done('ภาพความทรงจำแตกสลาย... ดูเหมือนจะเลือกผิด','bad'); } qNext('ความทรงจำชัดขึ้น เงานั้นยิ้มให้คุณ'); }}))}; }
    case 2: { const [rid,rt]=L.rel[0], rn=x=>x==='villager'?'ชาวบ้าน':ALLCHARS[x].c.name.split(' ')[0];
      const opts=shuffle([rid, ...others(2).filter(x=>x!==rid).slice(0,2)]);
      return {title:T, icon:'💞', text:`ในความทรงจำมีใครบางคนที่วีรชนผู้นี้เรียกว่า "${rt}"\nคนนั้นคือใคร?`, choices: opts.map(x=>({label:rn(x), fn:()=>{ if (x!==rid){ S.q=null; S.qCool=S.floor+20; return done('ความทรงจำเลือนหาย... ไม่ใช่คนนั้น','bad'); } qNext(`ใช่แล้ว! เงาของวีรชนพยักหน้า "ไปพบข้าที่ชั้นข้างหน้า"`); }}))}; }
    case 3: { const m=makeMon(F); m.name=`เงาแห่ง${nm.split(' ')[0]}`; m.icon=charArt(a.c); m.hp*=3; m.maxhp=m.hp; m.atk*=1.35; m.el=a.c.el;
      return {title:T, icon:'⚔️', text:`เงาของวีรชนขวางทาง "พิสูจน์ว่าเจ้าคู่ควรกับพลังของข้า!"`, choices:[
        {label:'รับคำท้า!', fn:()=>fight([m], ()=>{ S.q.step=4; S.q.next=S.floor+1; addExp(monExp(F)*2); return 'เอาชนะเงาแห่งความทรงจำได้! วีรชนกำลังรออยู่ชั้นถัดไป'; })},
        {label:'ยังไม่พร้อม', alt:true, fn:()=>{ q.next=S.floor+4; done('ถอยออกมาตั้งหลัก เงายังรออยู่'); }}]}; }
    case 4: return {title:'✨ เส้นทางแห่งโชคชะตา (5/5)', icon:'🌟', qart:{npc:(ART.char[id])}, text:`${nm} ปรากฏตัวต่อหน้าคุณ\n"${L.trait.split(' ')[0]}... ข้าเห็นตัวเองในตัวเจ้า เจ้าจะเดินต่อในเส้นทางเดิม หรือจะรับพลังของข้าไป?"\n(ถ้าเลือกเส้นทางใหม่แล้วปราบบอสได้ จะได้ ${nm.split(' ')[0]} เป็นตัวถาวร)`, choices:[
      {label:'🔥 เดินทางสู่เส้นทางใหม่', sub:`กลายเป็น ${nm.split(' ')[0]} ทันที`, fn:()=>{ destinyTransform(id); S.qDone=(S.qDone||[]).concat('destiny'); S.q=null; S.destiny=id; done(`✨ ได้รับพลังของ ${nm}! ปราบบอสให้ได้เพื่อให้วีรชนอยู่กับคุณตลอดไป`,'good'); }},
      {label:'🛡️ คงความตั้งใจเดิม', sub:'รับพรถาวรตลอดรอบนี้', alt:true, fn:()=>{ trainOptions(F,3).slice(0,2).forEach(o=>applyTrain(o)); gainBook(1); const v=gainGold(base2(F)*3); S.qDone=(S.qDone||[]).concat('destiny'); S.q=null; done(`${nm} ยิ้มแล้วมอบพรให้ ได้สเตตัส 2 อย่าง ตำราสกิล และทอง ${fmt(v)}`,'good'); }}]};
  } }
function destinyTransform(id){ const a=ALLCHARS[id], r=S.hp/stats().maxhp;
  if (a.tier==='hid'){ awaken(a.cls); }
  else { S.cls=a.cls; S.char=a.c; S.villagerPath=false; adaptGear(); }
  S.pendingClass=false; S.hp=Math.max(1,stats().maxhp*r); }
function questEvent(){ const q=S.q, fnq = q.id==='destiny' ? null : (QUESTS[q.id]&&QUESTS[q.id].steps[q.step]);
  let e = q.id==='destiny' ? destinyStep(q) : (fnq ? fnq(q) : null);
  if (!e){ S.qDone=(S.qDone||[]).concat(q.id); S.q=null; S.qCool=S.floor+15; return null; }   // เควสจบแล้วหรือข้อมูลผิดพลาด: ปิดเควสแล้วไปเหตุการณ์ปกติ
  e.type='quest'; return e; }
function maybeQuest(){ if (S.q || (S.qCool||0)>S.floor || S.floor<12 || S.daily) return false;
  const done=S.qDone||[];
  if (S.char && !done.includes('destiny') && chance(4)){ S.q={id:'destiny',step:0,hero:destinyPick(),next:S.floor}; return true; }
  const pool=Object.keys(QUESTS).filter(k=>!done.includes(k)); if (pool.length && chance(5)){ S.q={id:pick(pool),step:0,next:S.floor}; return true; }
  return false; }
function rollEvent(){
  if (S.sinceMerchant >= 25) return pick(['mStat','mSkill','mPotion','mEquip']);
  let e;
  for (let i=0;i<10;i++){
    e = weighted(CONFIG.events);
    if (e==='boss' && (S.lv < CONFIG.bossMinLevel || !(S.char || S.villagerPath))) e='monster';
    if (e==='monster' && S.villagerPath && S.cls==='villager' && S.floor>10 && chance(100*CONFIG.orbRate/33)) e='orb';
    if ((e==='bad'||e==='badMon') && S.badStreak>=2) continue;
    if ((e==='bad'||e==='badMon') && chance(accVal('luck'))) e='gold';
    if (e==='altar' && (S.acc2 || S.floor<50)) continue;
    if (e==='rune' && S.floor>60 && !chance(Math.max(30, 100-(S.floor-60)*0.35))) e='gold';   // ยิ่งลึก รูนยิ่งหายาก (ต่ำสุด 30% ของเดิม)
    if (e==='mSkill' && booksUseless()) e='mStat';   // สกิลเต็มแล้ว ร้านตำรากลายเป็นร้านยาสเตตัส
    break;
  }
  return e;
}
function trainOptions(F, mult=1){
  const st=stats(), phy = CLASSES[S.cls].type==='phy', vil = S.cls==='villager';
  const a=Math.round((3+0.25*F)*mult), h=Math.round((20+2*F)*mult), d=Math.round((2+0.18*F)*mult);
  return shuffle([
    {k:'atk',label:`ATK +${a}`,v:a,ok:phy||vil},{k:'matk',label:`MATK +${a}`,v:a,ok:!phy||vil},
    {k:'hp',label:`HP +${h}`,v:h,ok:true},{k:'def',label:`DEF +${d}`,v:d,ok:true},{k:'mdef',label:`MDEF +${d}`,v:d,ok:true},
    {k:'cri',label:`คริติคอล +${Math.round(mult)}%`,v:Math.round(mult),ok:st.cri<75},
    {k:'cridmg',label:`ความแรงคริ +${Math.round(6*mult)}%`,v:Math.round(6*mult),ok:st.cridmg<300},
    {k:'pen',label:`${phy?'เจาะเกราะ':'เจาะเกราะเวท'} +${Math.round(mult)}%`,v:Math.round(mult),ok:st.pen<60},
  ].filter(x=>x.ok)).slice(0,3);
}
function applyTrain(o){
  const v = S.cls==='villager' ? Math.round(o.v*CONFIG.villagerTrain) : o.v;
  S.train[o.k] += v; if (o.k==='hp') S.hp += v; S.trainCount[TRAIN_GROUP[o.k]]++;
  return v; }

function buildEvent(type){
  const F = S.floor;
  const ev = (title, icon, text, choices) => ({type,title,icon,text,choices});
  switch(type){
    case 'monster': { const m = makeMon(F);
      return ev(`เจอ ${m.name}`, m.icon, `${m.name} ${elIcon(m.el)} ธาตุ${ELEMENTS[m.el].name} ขวางทางอยู่ข้างหน้า`, [
        {label:'สู้!', fn:()=>fight([m], ()=>reward(m))},
        {label:'แอบหนี', sub:'สำเร็จ 50%', alt:true, fn:()=> chance(50) ? done('หนีพ้นมาได้อย่างปลอดภัย') : (addLog('หนีไม่พ้น! ต้องสู้','bad'), fight([m], ()=>reward(m)))},
      ]); }
    case 'training': { const opts = trainOptions(F);
      return ev('ลานฝึกฝนเก่า','🏋️','พบลานฝึกของผู้กล้ารุ่นก่อน เลือกฝึก 1 อย่าง (เพื่อนได้โบนัส 40%)',
        opts.map(o=>({label:o.label, sub:S.cls==='villager'?'ชาวบ้าน +25%':'', fn:()=>{ const v=applyTrain(o); done(`ฝึกสำเร็จ ${o.label}${v!==o.v?` (ได้จริง +${v})`:''}`,'good'); }}))); }
    case 'mStat': { const opts = trainOptions(F,1.6), price = Math.round(40+4*F);
      return ev('พ่อค้ายาวิเศษ','🧪',`ขายยาเพิ่มสเตตัสถาวร ขวดละ ${fmt(price)} ทอง`,
        [...opts.map(o=>({label:o.label, sub:`${fmt(price)} ทอง`, disabled:S.gold<price, fn:()=>{ S.gold-=price; applyTrain(o); done(`ดื่มยา ${o.label}`,'good'); }})),
         {label:'ไม่ซื้อ', alt:true, fn:()=>done('เดินผ่านไป')}]); }
    case 'mSkill': { const price=Math.round(60+5*F);
      return ev('พ่อค้าตำราสกิล','📜',`ขายตำราสกิล ใช้อัปเลเวลสกิลได้ทุกช่อง (ตันที่ Lv.5)\nมีตำราอยู่ ${S.books} เล่ม`,[
        {label:'ซื้อ 1 เล่ม', sub:`${fmt(price)} ทอง`, disabled:S.gold<price, fn:()=>{ S.gold-=price; done(gainBook(1),'good'); }},
        {label:'ซื้อ 2 เล่ม', sub:`${fmt(price*3)} ทอง`, disabled:S.gold<price*3, fn:()=>{ S.gold-=price*3; done(gainBook(2),'good'); }},
        {label:'ไม่ซื้อ',alt:true,fn:()=>done('เดินผ่านไป')}]); }
    case 'mPotion': { const p1=Math.round(30+3*F), p2=Math.round(80+5*F);
      const cursed = S.poison>0 || S.mods.atk<0 || S.mods.def<0 || S.mods.cri<0 || S.goldCurse>0;
      return ev('ยายหมอยา','⚗️','คุณยายหมอยาขายยาฟื้นฟูและยาชำระคำสาป',[
        {label:'ยาฟื้นฟู (ทั้งทีม 50%)', sub:`${fmt(p1)} ทอง`, disabled:S.gold<p1, fn:()=>{ S.gold-=p1; const v=heal(0.5); healMates(0.5); done(`ทีมฟื้น HP (คุณ +${fmt(v)})`,'good'); }},
        {label:'ยาชำระคำสาป', sub:`${fmt(p2)} ทอง`, disabled:S.gold<p2||!cursed, fn:()=>{ S.gold-=p2; cleanse(); done('คำสาปทั้งหมดหายไป','good'); }},
        {label:'ไม่ซื้อ', alt:true, fn:()=>done('เดินผ่านไป')}]); }
    case 'bad': {
      const subs = ['thief','poison','trap']; if (aliveMates()) subs.push('injury');
      const sub = pick(subs);
      if (sub==='thief'){ const m=makeMon(F,'thief'), lose=Math.round(S.gold*0.15);
        return ev('โจรดักปล้น!','🥷','โจรกระโดดออกมาขวางทาง เรียกค่าผ่านทาง',[
          {label:'จ่ายค่าผ่านทาง', sub:`เสีย ${fmt(lose)} ทอง`, fn:()=>{ S.gold-=lose; done(`เสียทอง ${fmt(lose)}`,'bad'); }},
          {label:'สู้กับโจร', sub:'ชนะได้ทองเพิ่ม', alt:true, fn:()=>fight([m], ()=>{ const g=gainGold(monGold(F)*3); addExp(monExp(F)); return `ไล่โจรไปได้ ได้ทอง ${fmt(g)}`; })}]); }
      if (sub==='poison') return ev('หมอกพิษ','☠️','เดินเข้าไปในหมอกพิษ ร่างกายเริ่มชา',[
          {label:'กินสมุนไพรแปลกๆ', sub:'50% ล้างพิษได้', fn:()=> chance(50) ? done('สมุนไพรได้ผล ไม่ติดพิษ','good') : (S.poison=Math.round(10*(1-accVal('ward')/100)), done(`สมุนไพรไม่ได้ผล ติดพิษ ${S.poison} ชั้น`,'bad'))},

        {label:'เดินผ่าน', alt:true, fn:()=>done('เดินผ่านไป')}]); }

        {label:'วางมือบนแท่น', fn:()=>{ S.acc2=true; done('ปลดล็อกช่องเครื่องประดับที่ 2 แล้ว!','good'); }}]);

    case 'boss': { const bosses=makeBosses(), bl=bossLevel(), rp=Math.min(75, RUNE[S.rune.lv].pct + (S.rune.lv?accVal('cloak'):0)), est=estimateWin(bosses);

      return ev('บอสปรากฏตัว!','😈',`พลังมืดแผ่ซ่าน… ${elIcon(bosses[0].el)} ${bosses[0].name}${extra}${bosses.some(b=>b.trueForm)?'\nบอสตัวสุดท้ายมีร่างแท้จริง':''}\n\n📊 โอกาสชนะโดยประมาณ ${est}% (${lvl}) คำนวณจากสภาพทีมตอนนี้${runeLine}`,[
        {label:'สู้กับบอส!', sub:`โอกาสชนะ ~${est}%`, fn:()=>fight(bosses, ()=>{ victory(); return 'ปราบบอสได้!'; })},

function offerEvent(it, prefix, back, paid){
  const slots = it.slot==='acc' ? (S.acc2 ? ['acc','acc2'] : ['acc']) : [it.slot];
  const cur = slots.map(s=>`ตอนนี้ (${SLOT_NAME[s]}): ${itemHtml(S.gear[s])}`).join('\n');
  const fin = t => { if (back){ S.result={text:t}; S.ev=back(); } else done(t,'good'); };
  const choices = slots.map(s=>({label:`สวมใส่${slots.length>1?' '+SLOT_NAME[s]:''}`, disabled:!!(S.gear[s]&&S.gear[s].lock), sub:S.gear[s]&&S.gear[s].lock?'🔒 ของเดิมล็อกอยู่':S.gear[s]?`ขายของเดิม +${fmt(sellVal(S.gear[s]))} ทอง`:'ช่องว่าง',
    fn:()=>{ const old=S.gear[s];
      const equip = ()=>{ if (old) sellGold(sellVal(old)); const mx0=stats().maxhp; S.gear[s]=it; S.hp=Math.max(1,S.hp+stats().maxhp-mx0); fin(old?`สวมใส่ ${it.name} แล้ว (ขาย ${old.name} ได้ ${fmt(sellVal(old))} ทอง)`:`สวมใส่ ${it.name} แล้ว`); };
      if (!old) return equip();
      S.ev = {type:'confirm', title:'ยืนยันเปลี่ยนอุปกรณ์?', icon:'⚠️',
        text:`<b>ใส่ใหม่:</b> ${itemHtml(it)}\n<b>ของเดิม:</b> ${itemHtml(old)}\n\n⚠️ <b style="color:var(--hp2)">${old.name}${old.plus?' +'+old.plus:''} จะถูกขายและหายไปถาวร</b> (ได้ ${fmt(sellVal(old))} ทอง)`,
        choices:[{label:'ยืนยัน สวมใส่ของใหม่', sub:`ของเดิมหายไป +${fmt(sellVal(old))} ทอง`, fn:equip},
                 {label:'ยกเลิก', alt:true, sub:'กลับไปเลือกใหม่', fn:()=>{ S.ev = offerEvent(it, prefix, back, paid); }}]}; }}));
  choices.push({label:'ขายทิ้ง', alt:true, sub:`+${fmt(sellVal(it))} ทอง`, fn:()=>{ sellGold(sellVal(it)); fin(`ขาย ${it.name} ได้ ${fmt(sellVal(it))} ทอง`); }});
  if (paid) choices.push({label:'ไม่เอาแล้ว · ออกจากร้าน', alt:true, leave:true, sub:`คืนเงิน ${fmt(paid)} ทอง`, fn:()=>{ S.gold+=paid; S.st.items=Math.max(0,S.st.items-1); S.shop=null; done(`คืน ${it.name} ได้เงินคืน ${fmt(paid)} ทอง แล้วออกจากร้าน`); }});
  return {type:'offer', item:it, title:'ได้อุปกรณ์!', icon:itIco(it), text:`${prefix?prefix+'\n\n':''}${itemHtml(it)}\n\n${cur}`, choices};
}
function shopPreview(it, i){
  const price=buyVal(it), slots = it.slot==='acc' ? (S.acc2 ? ['acc','acc2'] : ['acc']) : [it.slot];
  const cur = slots.map(s=>`ตอนนี้ (${SLOT_NAME[s]}): ${itemHtml(S.gear[s])}`).join('\n');
  const choices = slots.map(s=>{ const old=S.gear[s], lock=!!(old&&old.lock);
    return {label:`ซื้อ${slots.length>1?' ใส่'+SLOT_NAME[s]:''}`, disabled:S.gold<price||lock,
      sub: lock?'🔒 ของเดิมล็อกอยู่' : S.gold<price?`${fmt(price)} ทอง (ทองไม่พอ)` : `${fmt(price)} ทอง${old?` · ของเดิมขายได้ +${fmt(sellVal(old))}`:''}`,
      fn:()=>{ S.gold-=price; S.st.items++; S.shop.items.splice(S.shop.items.indexOf(it),1);
        if (old) sellGold(sellVal(old)); const mx0=stats().maxhp; S.gear[s]=it; S.hp=Math.max(1,S.hp+stats().maxhp-mx0);
        S.result={text:old?`ซื้อและสวมใส่ ${it.name} แล้ว (ขาย ${old.name} ได้ ${fmt(sellVal(old))} ทอง)`:`ซื้อและสวมใส่ ${it.name} แล้ว`}; S.ev=merchantEquip(); }}; });
  choices.push({label:'กลับไปหน้าร้าน', alt:true, back:true, fn:()=>{ S.ev = merchantEquip(); }});
  choices.push({label:'ออกจากร้าน', alt:true, leave:true, fn:()=>{ S.shop=null; done('ออกจากร้านพ่อค้าอุปกรณ์'); }});
  return {type:'offer', item:it, title:'ดูสินค้า', icon:itIco(it), text:`${itemHtml(it)}\nราคา <b class="gold">${fmt(price)} ทอง</b> (มี ${fmt(S.gold)})\n\n${cur}`, choices};
}
function merchantEquip(){
  const F=S.floor;
  if (!S.shop || S.shop.f!==F) S.shop = {f:F, items:[0,1,2].map(i=>makeItem(F, null, i===0?Math.max(1,rollRarity(F)):rollRarity(F)))};
  const choices = S.shop.items.map((it,i)=>({label:`<span class="r${it.r}">${itIco(it)} ${it.name}</span>`, sub:`${it.set?setTag(it.set)+' ':''}${RARITY[it.r].th} · ${fmt(buyVal(it))} ทอง`, disabled:S.gold<buyVal(it), item:it,
    fn:()=>{ S.ev = shopPreview(it, i); }}));
  const hasGear = Object.values(S.gear).some(x=>x && x.plus<10);
  choices.push({label:'🔨 ตีบวกอุปกรณ์', alt:true, disabled:!hasGear, enh:true, fn:()=>{ S.ev = enhanceMenu(); }});
  choices.push({label:'ออกจากร้าน', alt:true, wide:true, leave:true, fn:()=>{ S.shop=null; done('ออกจากร้านพ่อค้าอุปกรณ์'); }});

function enhanceItem(slot, msg){

function applyCurse(){

  if (c==='poison'){ S.poison=Math.max(S.poison,10); return 'คำสาปพิษ 10 ชั้น'; }
  if (c==='atk'){ S.mods.atk-=5; return 'คำสาปอ่อนแรง ATK/MATK -5% ถาวร (ทั้งทีม)'; }

  if (c==='cri'){ S.mods.cri-=3; return 'คำสาปโชคร้าย CRI -3% ถาวร'; }
  if (c==='gold'){ S.goldCurse=20; return 'คำสาปทองรั่ว ทองที่ได้ -20% (20 ชั้น)'; }
  if (S.rune.lv){ S.rune.timer=Math.max(1,S.rune.timer-10); return 'คำสาปกัดกร่อนรูน อายุรูน -10 ชั้น'; }
  S.mods.atk-=5; return 'คำสาปอ่อนแรง ATK/MATK -5% ถาวร (ทั้งทีม)';
}
function cleanse(){ S.poison=0; S.goldCurse=0; S.mods={atk:Math.max(0,S.mods.atk),def:Math.max(0,S.mods.def),cri:Math.max(0,S.mods.cri)}; }

/* ---------- flow ---------- */
let UI = null;
function step(){
  if (S.over) return;
  S.floor++; S.sinceMerchant++;
  heal(CONFIG.walkRegen); healMates(CONFIG.walkRegen);
  S.party.forEach(m=>{ if (m.ko>0 && --m.ko===0){ m.hp=mateStats(m).maxhp*0.3; addLog(`${unitName(m.cls,m.char)} กลับเข้าทีม`,'good'); } });
  if (S.poison>0){ const d=Math.round(stats().maxhp*0.03); S.hp=Math.max(1,S.hp-d); S.poison--; }
  if (S.goldCurse>0) S.goldCurse--;
  if (S.rune.lv){ S.rune.timer--; if (S.rune.timer<=0){ S.rune.lv--; S.rune.timer = S.rune.lv?CONFIG.runeLife+accVal('compass'):0; addLog(S.rune.lv?`รูนอ่อนลงเป็น${RUNE[S.rune.lv].name}`:'รูนแตกสลาย','bad'); } }
  if ((S.q && S.floor>=S.q.next) || maybeQuest()){ const qe=questEvent(); if (qe){ S.ev = qe; S.result=null; S.phase='event'; return; } }
  const type = rollEvent();
  if (type.startsWith('m') && type!=='monster') S.sinceMerchant=0;
  S.badStreak = (type==='bad'||type==='badMon') ? S.badStreak+1 : 0;
  S.ev = buildEvent(type); S.result=null; S.phase='event';
}
function done(text, cls=''){ S.result={text,cls}; addLog(text,cls); S.phase='walk'; S.ev=null; }
function checkDead(cause){ if (S.hp<=0){ S.hp=0; endRun(false, cause); } }
function fight(mons, onWin){
  const res = battle(mons);
  const finish = ()=>{
    mergeBS(res.bs, res.win);
    const U = res.units; S.hp = Math.max(res.win?1:0, U[0].hp); if (res.featherUsed){ S.featherUsed=true; addLog('ขนนกฟีนิกซ์ถูกใช้ไปแล้ว','bad'); }
    S.party.forEach((m,i)=>{ const u=U[i+1]; if (m.ko) return; if (u.hp<=0){ m.ko=CONFIG.mateKoFloors; m.hp=0; addLog(`${u.name} บาดเจ็บ ออกจากทีม ${CONFIG.mateKoFloors} ชั้น`,'bad'); } else m.hp=u.hp; });
    if (!res.win && !mons.some(x=>x.kind==='boss')){   // แพ้มอนทั่วไป/มินิบอส: ไม่ตาย แต่เสียทองและพลัง (ตายจริงได้เฉพาะบอส)
      const lose=Math.round(S.gold*0.3); S.gold-=lose; S.hp=Math.max(1,Math.round(stats().maxhp*0.3)); S.st.knock=(S.st.knock||0)+1;
      done(`💫 พ่ายแพ้ให้ ${mons[mons.length-1].name} แต่รอดมาได้หวุดหวิด!\nทิ้งทอง ${fmt(lose)} แล้วถอยหนีมา (HP เหลือ 30%)`,'bad'); return; }
    if (!res.win){ endRun(false, `แพ้ให้ ${mons[mons.length-1].name}`); return; }
    const txt = onWin(res);
    if (S.over) return;
    if (S.offer){ const it=S.offer; S.offer=null; S.result=null; addLog(txt,'good'); S.ev = offerEvent(it, txt); S.phase='event'; }
    else done(txt, 'good');
  };
  S.bossFight=mons.some(x=>x.kind==='boss');
  if (UI) { S.phase='battle'; UI.playBattle(res, mons, finish); } else finish();
}
function score(){ const boss = S.over && S.over.win ? bossLevel()*300 : 0; return S.floor*10 + S.lv*20 + boss + aliveMates()*100 + gearScore(); }
/* คะแนนจัดอันดับหอคอยไร้สิ้นสุด: แยกจากคะแนนเหรียญตรา คิดจากหลายอย่างรวมกัน */
function rankScore(win){ const st=stats(), t=S.st||{}, bl=bossLevel(), sk=(S.skillLv||[]).reduce((a,b)=>a+(b||0),0);
  const pw=Math.round((st.maxhp||0)/10 + Math.max(st.atk||0,st.matk||0)*2 + (st.def||0) + (st.mdef||0) + (st.cri||0)*20 + Math.max(0,(st.cridmg||0)-100)*4 + (st.pen||0)*15 + (st.spd||0)*2);
  const bossPart = win ? bl*2000 : (t.bossHp&&t.bossHp.max ? Math.round((1-t.bossHp.left/t.bossHp.max)*bl*1000) : 0);
  const parts=[['🧭',`ชั้นที่ไปถึง ${S.floor} x 100`,S.floor*100],['⭐',`เลเวลตัวละคร ${S.lv} x 40`,S.lv*40],
    ['😈',win?`ปราบบอส Lv.${bl} x 2,000`:`ดาเมจใส่บอส Lv.${bl}`,bossPart],['🛡️','อุปกรณ์ (คะแนนอุปกรณ์ x 6)',gearScore()*6],
    ['📘',`เลเวลสกิลรวม ${sk} x 120`,sk*120],['💪','พลังจากค่าสถานะ',pw],['👾',`มอนสเตอร์ที่กำจัด ${S.kills||0} x 5`,(S.kills||0)*5],
    ['🤝',`เพื่อนที่รอด ${aliveMates()} x 500`,aliveMates()*500],['🌟',`ดาววีรชน ${starOf(S.char)} x 300`,starOf(S.char)*300]];
  let total=parts.reduce((a,p)=>a+p[2],0); const mults=[];
  if (S.curses){ mults.push(['☠️',`โบนัสคำสาป ${S.curses} ครั้ง`,1+0.1*S.curses]); }
  if (win && S.cls==='villager'){ mults.push(['🌾','โบนัสชาวบ้านปราบบอส',1.3]); }
  mults.forEach(x=>total*=x[2]); return {total:Math.round(total), parts, mults}; }

const LB_CAP = {endless:50000000, daily:50000000, hundred:100, dragon:1000000000000};
function gearMini(g){ return Object.entries(g||{}).filter(([k,v])=>v&&v.name).map(([k,v])=>[k, v.name, v.r||0, v.plus||0, v.icon||'', v.set&&SETS[v.set]?SETS[v.set].name:'']); }

  return {v:2, floor:S.floor, lv:S.lv, win:!!win, char:S.char?S.char.id:null, cls:S.cls, t:Date.now(), boss:bossLevel(), power:powerOf(st), gold:S.gold, items:t.items||0, kills:S.kills||0, curses:S.curses||0,
    st:{hp:st.maxhp, atk:st.atk, matk:st.matk, def:st.def, mdef:st.mdef, cri:Math.round(st.cri*10)/10, cridmg:st.cridmg, pen:Math.round((st.pen||0)*10)/10, spd:st.spd, type:st.type},
    gear:gearMini(S.gear), sk, party:(S.party||[]).map(p=>[p.char?p.char.id:null, unitName(p.cls,p.char), !!p.ko])}; }
/* รายการคะแนนที่จะส่งขึ้นตารางอันดับ (ใช้โดยระบบคลาวด์) — เติมข้อมูลจากบันทึกวีรชนให้รอบเก่าที่ยังไม่มีรายละเอียด */
function lbList(m){ const d=new Date(Date.now()-5*3600e3), today=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(), out=[];
  const fill=det=>{ if (det.gear || !det.char || !m.chars || !m.chars[det.char]) return det; const c=m.chars[det.char], rec=c.recs&&(c.recs[c.main]||c.recs[0]); if (!rec) return det;
    const st=rec.st||{}; return Object.assign({}, det, {v:2, fromRec:1, power:rec.power, boss:rec.boss, st:{hp:st.maxhp, atk:st.atk, matk:st.matk, def:st.def, mdef:st.mdef, cri:st.cri, cridmg:st.cridmg, pen:st.pen, spd:st.spd, type:st.type}, gear:gearMini(rec.gear), sk:(rec.skills||[]).map(x=>[x.name,x.lv])}); };
  const cap=(b,v)=>Math.max(0,Math.min(LB_CAP[b],Math.round(v||0)));
  if (m.rankBest){ const det=fill(Object.assign({}, m.rankInfo||{})); out.push(['endless','all',cap('endless',m.rankBest),det,det.char||null]); }
  if (m.dailyBest&&m.dailyBest.day===today&&m.dailyBest.rank){ const det=fill(Object.assign({floor:m.dailyBest.floor,win:m.dailyBest.win}, m.dailyBest.info||{})); out.push(['daily',today,cap('daily',m.dailyBest.rank),det,det.char||null]); }
  if (m.ht&&m.ht.best){ const team=(m.ht.team||[]).filter(Boolean); out.push(['hundred','all',cap('hundred',m.ht.best),{team},team[0]||null]); }
  if (m.dh&&m.dh.best&&m.dh.wk!=null){ const team=(m.dh.team||[]).filter(Boolean); out.push(['dragon',String(m.dh.wk),cap('dragon',m.dh.best),{slain:!!m.dh.slain,team},team[0]||null]); }
  return out; }
function endRun(win, cause){
  if (S.over) return;
  S.over = {win, cause: cause||''}; if (S.daily) rng = Math.random;
  const sc = score(); let medals = Math.floor(sc/100);

  S.over.score = sc; S.over.medals = medals; S.over.rank = rankScore(win);

    if (/^rl/.test(act) && relicAct(act,b)) return true;
    if (act==='frset'){ const m1=loadMeta(); m1.frame=b.dataset.k; storeMeta(m1); render(); return true; }
    if (act==='frinfo'){ const f=FRAMES.find(x=>x.k===b.dataset.k); hubMsg=`🔒 ${f.n}: ${f.d}`; render(); return true; }
    if (act==='advprep'){ advPrep=true; render(); return true; }
    if (act==='advback'){ advPrep=false; render(); return true; }
    if (act==='trtab'){ trTab=b.dataset.k; render(); return true; }
    if (act==='shtab'){ shTab=b.dataset.k; render(); return true; }
    if (act==='goshop'){ hub='shop'; shTab=b.dataset.k; render(); return true; }
    if (act==='modesoon'){ hubMsg=`${b.dataset.k}: เร็วๆ นี้`; render(); return true; }
    if (act==='shbuy'){ const m1=loadMeta(), i=+b.dataset.i, x=shardStock()[i], d=dayKey(); if (!m1.shopBuy||m1.shopBuy.d!==d) m1.shopBuy={d,i:[]};
      if (m1.shopBuy.i.includes(i)) return true; if (m1.dust<x.p){ hubMsg='ผงดาวไม่พอ'; render(); return true; }
      m1.dust-=x.p; m1.shards[x.id]=(m1.shards[x.id]||0)+x.n; m1.shopBuy.i.push(i); hubMsg=`ได้เศษ ${ALLCHARS[x.id].c.name.split(' ')[0]} x${x.n}`; storeMeta(m1); render(); return true; }
    if (act==='ctab'){ cTab = b.dataset.k; render(); return true; }
    if (act==='wopen'){ wPop = true; render(); return true; }
    if (act==='wclose'){ wPop = false; render(); return true; }
    if (act==='gtab'){ gTab = b.dataset.k; render(); return true; }
    if (act==='gclose'){ summon = false; render(); return true; }
    if (act==='setrec'){ const c=m.chars[b.dataset.k]; if (c){ c.main=+b.dataset.i; } return done(); }
    if (act==='showmain'){ m.show.main=b.dataset.k; m.show.team=(m.show.team||[]).filter(x=>x!==b.dataset.k); return done(); }
    if (act==='showteam'){ const id=b.dataset.k, t=m.show.team||[]; m.show.team = t.includes(id) ? t.filter(x=>x!==id) : t.concat(id).slice(-2); return done(); }
    if (act==='avpick'){ avPop=true; render(); return true; }
    if (act==='avclose'){ avPop=false; render(); return true; }
    if (act==='avset'){ const k=b.dataset.k; m.show.main=k; if (!k.startsWith('cls:')) m.show.team=(m.show.team||[]).filter(x=>x!==k); avPop=false; return done(); }
    if (/^dev/.test(act) && !DEV_ON) return true;
    if (act==='devopen'){ devOpen=true; render(); return true; }
    if (act==='devgive'){ const k=b.dataset.k; idleFlush(); if (k==='dh'){ const m2=loadMeta(); dhState(m2); m2.dh.scales+=1000; m2.dh.tries.n=0; storeMeta(m2); render(); return true; }
      if (k==='gold'||k==='eqtix'){ const m2=loadMeta(); if (k==='gold') m2.idle.gold+=(+b.dataset.n); else m2.eq.tix+=(+b.dataset.n); storeMeta(m2); render(); return true; } m[k]=(m[k]||0)+(+b.dataset.n); hubMsg='เสกแล้ว'; storeMeta(m); render(); return true; }
    if (act==='devchar'||act==='devall'||act==='devmax'){
      const put=(id,st,fm)=>{ const c=m.chars[id]||(m.chars[id]={star:1,form:false,recs:[],main:0}); c.star=Math.max(c.star,st); if (fm) c.form=true; };
      if (act==='devchar'){ const id=document.getElementById('devc').value; put(id,+document.getElementById('devs').value,document.getElementById('devf').checked); hubMsg='เสก '+ALLCHARS[id].c.name+' แล้ว'; }
      else Object.keys(ALLCHARS).forEach(id=>put(id,act==='devmax'?5:1,act==='devmax'));
      storeMeta(m); render(); return true; }
    if ((act==='gdtab'||act==='guideopen') && gdAct(act,b)) return true;
    if (/^mail/.test(act) && mailAct(act,b)) return true;
    if (act==='tutreset'){ const m=loadMeta(); m.tut={}; storeMeta(m); setPop=false; render(); return true; }
    if (act==='settings'){ setPop=true; resetAsk=false; savePop=null; saveMsg=''; render(); return true; }
    if (act==='vertap'){ if (/github\.io$/.test(location.hostname)) return true; if (++devTap>=7 && !DEV_ON){ DEV_ON=true; render(); } return true; }
    if (act==='svex'){ idleFlush(); saveMsg=''; saveCode='กำลังสร้างรหัส...'; savePop='ex'; render(); saveEncode(loadMeta()).then(c=>{ saveCode=c; if (savePop==='ex') render(); }); return true; }
    if (act==='svim'){ savePop='im'; saveMsg=''; render(); return true; }
    if (act==='svclose'){ savePop=null; saveMsg=''; render(); return true; }
    if (act==='svcopy'){ const ta=document.getElementById('svout'); const ok=()=>{ saveMsg='คัดลอกแล้ว นำไปวางเก็บไว้ได้เลย'; render(); };
      const fb=()=>{ try{ ta.select(); ta.setSelectionRange(0,ta.value.length); document.execCommand('copy'); ok(); }catch(e){ saveMsg='คัดลอกอัตโนมัติไม่ได้ กดค้างที่ช่องแล้วเลือกคัดลอกเอง'; render(); } };
      if (navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(saveCode).then(ok,fb); else fb(); return true; }
    if (act==='svload'){ const v=(document.getElementById('svin').value||'').trim();
      saveDecode(v).then(d=>{ const nm=normMeta(d); storeMeta(nm); hub=null; savePop='ok'; saveMsg=`ยินดีต้อนรับกลับ ${nm.name||''} · วีรชน ${Object.keys(nm.chars||{}).length} ตัว`; render(); })
        .catch(err=>{ saveMsg='❌ '+err.message; render(); }); return true; }
    if (act==='svdone'){ try{ location.reload(); }catch(e){ setPop=false; savePop=null; render(); } return true; }
    if (act==='setclose'){ setPop=false; render(); return true; }
    if (act==='savename'){ const v=(document.getElementById('pname').value||'').trim().slice(0,16); if (v) m.name=v; setPop=false; return done(); }
    if (act==='resetask'){ resetAsk=true; render(); return true; }
    if (act==='resetno'){ resetAsk=false; render(); return true; }
    if (act==='resetdo'){ storeMeta(normMeta(null)); setPop=false; resetAsk=false; hub=null; render(); return true; }
    if (act==='recmain'){ setMainRec(b.dataset.k, +b.dataset.i); if (S.over && S.over.rw && S.over.rw.rec) S.over.rw.rec.chosen = +b.dataset.i; render(); return true; }
    if (act==='home'){ S.phase='title'; hub=null; render(); window.scrollTo(0,0); return true; }
    return false;
  }

  // กลับมาจากลิงก์ในอีเมล: ข้อมูลอยู่หลังเครื่องหมาย # ของลิงก์
  async function fromEmailLink(){ const h=new URLSearchParams(location.hash.slice(1)); if (!h.get('access_token')&&!h.get('error_code')&&!h.get('error')) return false;
    history.replaceState(null,'',location.pathname+location.search);

  let lbBusy=false, LB={state:'idle'};

  const lbSet=v=>{ LB=Object.assign({t:Date.now()},v); window.__dqLB=LB; try{ document.dispatchEvent(new CustomEvent('dqlb')); }catch(e){} };
  async function lbSync(force){ if (!auth){ lbSet({state:'guest'}); return LB; } if (lbBusy) return LB; lbBusy=true; lbSet({state:'sending'});

      let sent={}; try{ sent=JSON.parse(get('dq_lb_sent')||'{}'); }catch(e){}

    }catch(e){ fail=e; }
    lbBusy=false; lbSet(fail?{state:'err',msg:lbErr(fail),ok}:{state:'ok',ok}); return LB; }
  const _push=push; push=async function(f){ await _push(f); lbSync(); };
  /* ---------- แชทโลก ---------- */
  async function chatFetch(after,lim){ return await req(`/rest/v1/chat_messages?select=id,user_id,name,hero,body,created_at&channel=eq.world${after?'&id=gt.'+after:''}&order=id.desc&limit=${lim||60}`,{method:'GET'},!!auth); }
  async function chatSend(body,name,hero){ return await rpc('send_chat',{p_body:body,p_name:name,p_hero:hero}); }
  const chatErr=e=>{ const s=(e&&e.message)||String(e); if (/Could not find|does not exist|schema cache/i.test(s)||(e&&e.status===404)) return 'ระบบแชทบนเซิร์ฟเวอร์ยังไม่ได้ติดตั้ง (ต้องรันไฟล์ chat.sql ใน Supabase)';
    if (/too fast/i.test(s)) return 'ส่งเร็วเกินไป รอสักครู่แล้วส่งใหม่'; if (/not logged in|หมดเวลาเข้าสู่ระบบ/i.test(s)) return 'เข้าสู่ระบบก่อนจึงจะส่งข้อความได้'; if (/empty/i.test(s)) return 'พิมพ์ข้อความก่อนส่ง'; return thErr(e); };
  /* ---------- สนามประลอง ---------- */
  const AR_SEL='user_id,name,rating,power,team,wins,losses';
  async function arOpp(r){ const near=await req(`/rest/v1/arena_teams?select=${AR_SEL}&rating=gte.${Math.round(r-250)}&rating=lte.${Math.round(r+250)}&order=updated_at.desc&limit=40`,{method:'GET'},true)||[];
    if (near.length>=4) return near; const any=await req(`/rest/v1/arena_teams?select=${AR_SEL}&order=updated_at.desc&limit=40`,{method:'GET'},true)||[]; const seen=new Set(near.map(x=>x.user_id)); return near.concat(any.filter(x=>!seen.has(x.user_id))); }
  async function htHelp(){ const r=await req(`/rest/v1/arena_teams?select=user_id,name,team&order=updated_at.desc&limit=30`,{method:'GET'},true)||[]; const me=auth&&auth.user?auth.user.id:''; return r.filter(x=>x.user_id!==me); }
  async function arSet(name,team,power){ const r=await rpc('arena_set',{p_name:name,p_team:team,p_power:power}); return Array.isArray(r)?r[0]:r; }
  async function arReport(opp,win){ const r=await rpc('arena_report',{p_opp:opp,p_win:win}); return Array.isArray(r)?r[0]:r; }
  async function arTop(){ return await req(`/rest/v1/arena_teams?select=user_id,name,rating,wins,losses&order=rating.desc&limit=20`,{method:'GET'},!!auth); }
  async function arDefLog(){ return await userReq(`/rest/v1/arena_log?select=att_name,win,delta,created_at&defender=eq.${auth.user.id}&order=id.desc&limit=10`,{method:'GET'}); }
  const arErr=e=>{ const s=(e&&e.message)||String(e); if (/Could not find|does not exist|schema cache/i.test(s)||(e&&e.status===404)) return 'สนามประลองบนเซิร์ฟเวอร์ยังไม่ได้ติดตั้ง (ต้องรันไฟล์ arena.sql ใน Supabase) ตอนนี้สู้กับบอทไปก่อน';
    if (/too fast/i.test(s)) return 'ประลองถี่เกินไป รอสักครู่'; if (/too many/i.test(s)) return 'วันนี้ส่งผลประลองครบโควตาแล้ว'; if (/set defense/i.test(s)) return 'ยังไม่ได้บันทึกทีมป้องกัน'; return thErr(e); };
  window.__dqCloud={push,pull,lbTop,lbMine,lbSync,lbErr,chatFetch,chatSend,chatErr,arOpp,arSet,arReport,arTop,htHelp,arDefLog,arErr,get auth(){ return auth; }};
})();
