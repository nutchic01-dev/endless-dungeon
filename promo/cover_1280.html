<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#120b1e;color:#fff4dc}
.p{position:relative;width:1280px;height:720px;overflow:hidden;background:url(../art/bg_loading.webp) center 30%/cover}
.f{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,11,30,.55),rgba(18,11,30,.1) 35%,rgba(18,11,30,.35) 62%,#120b1e 100%)}
.g{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(18,11,30,.55),transparent 45%)}
.top{position:absolute;top:40px;left:0;right:0;text-align:center}
.badge{display:inline-block;font-family:"Mitr";font-weight:500;font-size:24px;color:#3a2600;background:linear-gradient(180deg,#ffe58a,#ffbf2e 55%,#e8901a);padding:5px 22px;border-radius:999px;box-shadow:0 4px 0 #9a5a0a}
.l1{display:block;margin-top:14px;font-family:"Mitr";font-weight:500;font-size:38px;color:#fff4d8;letter-spacing:3px;text-shadow:0 3px 0 #5a2a0a,0 0 18px #000}
.l2{display:block;font-family:"Mitr";font-weight:600;font-size:96px;line-height:1.05;color:#ffd84a;text-shadow:0 -3px 0 #fff4b8,0 4px 0 #f08c12,0 9px 0 #4a1a06,0 0 40px rgba(18,11,30,.9),0 0 40px rgba(255,170,60,.55)}
.tag{margin-top:6px;font-family:"Mitr";font-size:28px;color:#fff;text-shadow:0 2px 8px #000,0 0 4px #000}
.heroes{position:absolute;left:0;right:0;bottom:-6px;display:flex;justify-content:center;align-items:flex-end}
.heroes img{height:215px;margin:0 -14px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.65))}
.heroes .big{height:262px;position:relative;z-index:2}
.heroes .sil{filter:brightness(0) drop-shadow(0 0 10px rgba(255,140,240,.9));height:175px}
.side{position:absolute;bottom:250px;height:190px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.7))}
</style></head><body><div class="p"><div class="f"></div><div class="g"></div>
<img class="side" style="left:20px" src="../art/dragon_fire.webp"><img class="side" style="right:20px;transform:scaleX(-1)" src="../art/dragon_water.webp">
<div class="top"><span class="badge">🎮 เกม Roguelite แฟนตาซี · เล่นฟรี</span>
<span class="l1">ผู้กล้าแห่ง</span><span class="l2">ดันเจี้ยนไร้สิ้นสุด</span>
<div class="tag">จากชาวบ้านธรรมดา สู่วีรชนในตำนาน · สะสมวีรชน 36 ตัว</div></div>
<div class="heroes"><img src="../art/char_shada.webp"><img src="../art/char_celeste.webp"><img src="../art/char_artemis.webp"><img src="../art/char_villager.webp"><img class="big" src="../art/char_leo.webp"><img src="../art/char_luna.webp"><img src="../art/char_blaze.webp"><img src="../art/char_athena.webp"></div>
</div></body></html>
