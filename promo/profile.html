<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;background:#120b1e}
.p{position:relative;width:1080px;height:1080px;overflow:hidden;background:url(../art/bg_loading.webp) 62% 8%/auto 175%}
.v{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,200,90,.3),rgba(18,11,30,.2) 40%,rgba(18,11,30,.8) 75%),linear-gradient(180deg,transparent 55%,#120b1e 80%)}
.ring{position:absolute;left:50%;top:38%;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,74,.45),rgba(255,140,40,.12) 55%,transparent 70%)}
.hero{position:absolute;left:50%;top:95px;height:600px;transform:translateX(-50%);filter:drop-shadow(0 14px 18px rgba(0,0,0,.7)) drop-shadow(0 0 30px rgba(255,200,90,.5))}
.ban{position:absolute;left:0;right:0;bottom:200px;text-align:center}
.ban span{display:inline-block;font-family:"Mitr";font-weight:600;font-size:150px;line-height:1;color:#ffd84a;text-shadow:0 -4px 0 #fff4b8,0 6px 0 #f08c12,0 13px 0 #4a1a06,0 0 50px rgba(18,11,30,.95),0 0 60px rgba(255,170,60,.6)}
.sub{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:"Mitr";font-weight:500;font-size:52px;color:#fff4d8;letter-spacing:4px;text-shadow:0 3px 0 #5a2a0a,0 0 20px #000}
</style></head><body><div class="p"><div class="v"></div><div class="ring"></div>
<img class="hero" src="../art/char_leo.webp">
<div class="ban"><span>ผู้กล้า</span></div><div class="sub">แห่งดันเจี้ยนไร้สิ้นสุด</div>
</div></body></html>
